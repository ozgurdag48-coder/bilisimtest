<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KHK Adaptif Öğrenme Portalı v3 - AI Powered</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #3498db;
            --success-color: #2ecc71;
            --danger-color: #e74c3c;
            --warning-color: #f39c12;
            --background-color: #f4f6f7;
            --text-color: #2c3e50;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--background-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 850px;
            background: white;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.06);
        }

        h1, h2 {
            text-align: center;
            color: var(--primary-color);
        }

        .btn {
            background-color: var(--secondary-color);
            color: white;
            border: none;
            padding: 12px 26px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            margin: 10px 5px;
            display: inline-block;
            font-weight: 600;
        }

        .btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .btn-nav { background-color: #95a5a6; }
        .btn-success { background-color: var(--success-color); }

        .topic-list {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 30px;
        }

        @media (max-width: 600px) {
            .topic-list { grid-template-columns: 1fr; }
        }

        .topic-card {
            background: #ffffff;
            border: 2px solid #e9ecef;
            padding: 20px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .topic-card:hover {
            border-color: var(--secondary-color);
            background: #f1f9fe;
            transform: translateY(-2px);
        }

        .topic-title {
            font-weight: 600;
            font-size: 16px;
            margin-bottom: 8px;
            color: var(--primary-color);
        }

        .badge {
            display: inline-block;
            padding: 4px 8px;
            font-size: 12px;
            border-radius: 4px;
            color: white;
            font-weight: bold;
        }
        .badge-easy { background-color: var(--success-color); }
        .badge-medium { background-color: var(--warning-color); }
        .badge-hard { background-color: var(--danger-color); }

        .page { display: none; }
        .active { display: block; }

        .status-msg {
            font-weight: bold;
            color: #d35400;
            margin: 20px 0;
            text-align: center;
            font-size: 16px;
            padding: 15px;
            background: #fff3cd;
            border-radius: 8px;
            border: 1px solid #ffeeba;
        }

        .question-container {
            margin-top: 25px;
            padding: 25px;
            border-left: 5px solid var(--secondary-color);
            background: #fdfdfd;
            border-radius: 0 8px 8px 0;
        }

        .options-list { list-style: none; padding: 0; }

        .option-item {
            margin: 12px 0;
            padding: 14px;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            background: #fff;
        }

        .option-item:hover { background-color: #f8f9fa; border-color: #bcd; }
        .option-item.correct { background-color: #d4edda !important; border-color: #c3e6cb; color: #155724; font-weight: 600; }
        .option-item.wrong { background-color: #f8d7da !important; border-color: #f5c6cb; color: #721c24; }

        .nav-buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 25px;
            border-top: 1px solid #eee;
            padding-top: 15px;
        }

        .info-panel {
            background-color: #f8f9fa;
            border: 1px solid #e9ecef;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            line-height: 1.6;
        }

        .search-log {
            font-family: 'Courier New', Courier, monospace;
            background: #2c3e50;
            color: #2ecc71;
            padding: 12px;
            border-radius: 6px;
            font-size: 12px;
            margin-top: 10px;
            text-align: left;
            max-height: 100px;
            overflow-y: auto;
        }
    </style>
</head>
<body>

<div class="container">
    
    <div id="homePage" class="page active">
        <h1>KHK Bilişim Sınav Portalı</h1>
        <p style="text-align:center; color:#7f8c8d; margin-bottom: 25px;">Yapay Zeka API Destekli Adaptif Test Motoru</p>
        <div class="topic-list" id="topicList"></div>
    </div>

    <div id="quizPage" class="page">
        <button class="btn btn-nav" onclick="goHome()">← Konu Listesine Dön</button>
        <h2 id="currentTopicTitle">Konu Başlığı</h2>
        
        <div class="info-panel" id="topicInfoPanel"></div>
        
        <div id="setupArea" style="text-align: center; margin: 30px 0;">
            <button class="btn" id="btnCreateTest" onclick="generateDynamicTest()">Yapay Zeka API ile Soruları Üret</button>
            <div id="statusMessage" class="status-msg" style="display: none;"></div>
            <button class="btn btn-success" id="btnStartTest" style="display: none;" onclick="startTest()">Teste Başla</button>
        </div>

        <div id="testArea" style="display: none;">
            <div style="font-weight: bold; color: #7f8c8d; display: flex; justify-content: space-between;" id="metaTracker">
                <span id="questionTracker">Soru: 1/10</span>
                <span id="scoreTracker">Doğru: 0</span>
            </div>
            <div class="question-container">
                <p id="questionText" style="font-size: 18px; font-weight: 600; line-height: 1.5;"></p>
                <ul class="options-list" id="optionsList"></ul>
            </div>
            <div class="nav-buttons">
                <div id="feedbackMessage" style="font-weight: bold; align-self: center; font-size: 18px;"></div>
                <button class="btn" id="btnNext" onclick="nextQuestion()" style="display: none;">Sonraki Soru</button>
            </div>
        </div>

        <div id="resultArea" style="display: none;">
            <h2>Test Sonucu</h2>
            <div style="text-align: center; font-size: 22px; font-weight: bold; margin: 25px 0;" id="scoreBoard"></div>
            <div style="text-align: center; font-size: 16px; margin-bottom: 25px; line-height: 1.6;" id="levelFeedback"></div>
            <div style="text-align: center;">
                <button class="btn" onclick="retryTopic()">Yeni Yapay Zeka Testi Üret</button>
            </div>
        </div>
    </div>

</div>

<script>
    const topics = [
        "Donanım ve Sayı Sistemleri",
        "Algoritma ve Programlama",
        "Ağlar ve Siber Güvenlik",
        "Veritabanı Yönetim Sistemleri",
        "Web Geliştirme Teknolojileri"
    ];

    // AI API Konfigürasyonu
    const AI_CONFIG = {
        apiUrl: "https://api.openai.com/v1/chat/completions", 
        apiKey: "YOUR_API_KEY_HERE", 
        model: "gpt-4o-mini" 
    };

    let appState = JSON.parse(localStorage.getItem('khk_infinite_adaptive_state')) || {};
    let selectedTopic = "";
    let currentQuestions = [];
    let currentQuestionIdx = 0;
    let score = 0;
    let hasAnswered = false;
    let wrongQuestionsInThisTest = [];
    const TEST_LIMIT = 10;

    function renderTopicList() {
        const listContainer = document.getElementById("topicList");
        if (!listContainer) return;
        listContainer.innerHTML = "";
        
        topics.forEach(topic => {
            if (!appState[topic]) {
                appState[topic] = {
                    currentLevel: 1, 
                    wrongQueue: []   
                };
            }
            const state = appState[topic];
            const card = document.createElement("div");
            card.className = "topic-card";
            
            let lvlBadge = "";
            if(state.currentLevel === 1) lvlBadge = `<span class="badge badge-easy">Seviye: Kolay (Lvl 1)</span>`;
            else if(state.currentLevel === 2) lvlBadge = `<span class="badge badge-medium">Seviye: Orta (Lvl 2)</span>`;
            else if(state.currentLevel === 3) lvlBadge = `<span class="badge badge-hard">Seviye: Zor (Lvl 3)</span>`;

            card.innerHTML = `
                <div class="topic-title">${topic}</div>
                <div>${lvlBadge}</div>
            `;
            card.onclick = () => loadTopic(topic);
            listContainer.appendChild(card);
        });
        localStorage.setItem('khk_infinite_adaptive_state', JSON.stringify(appState));
    }

    function loadTopic(topic) {
        selectedTopic = topic;
        document.getElementById("homePage").classList.remove("active");
        document.getElementById("quizPage").classList.add("active");
        document.getElementById("currentTopicTitle").innerText = topic;
        updateInfoPanel();
        resetQuizInterface();
    }

    function updateInfoPanel() {
        const state = appState[selectedTopic];
        const panel = document.getElementById("topicInfoPanel");
        let levelText = state.currentLevel === 1 ? "Kolay" : state.currentLevel === 2 ? "Orta" : "Zor";
        
        panel.innerHTML = `
            <strong>Mevcut Seviyeniz:</strong> Seviye ${state.currentLevel} (${levelText})<br>
            <strong>Yanlış Hafızasındaki Soru Sayısı:</strong> ${state.wrongQueue.length}<br>
            <small style="color:#7f8c8d;">* Soru üret butonuna bastığınızda, mevcut seviyeniz ve varsa geçmiş hatalarınız AI modeline parametre olarak geçilerek tamamen dinamik bir test hazırlanır.</small>
        `;
    }

    function goHome() {
        document.getElementById("quizPage").classList.remove("active");
        document.getElementById("homePage").classList.add("active");
        renderTopicList();
    }

    function resetQuizInterface() {
        document.getElementById("setupArea").style.display = "block";
        document.getElementById("btnCreateTest").style.display = "inline-block";
        document.getElementById("statusMessage").style.display = "none";
        document.getElementById("btnStartTest").style.display = "none";
        document.getElementById("testArea").style.display = "none";
        document.getElementById("resultArea").style.display = "none";
        wrongQuestionsInThisTest = [];
    }

    async function generateDynamicTest() {
        const btnCreate = document.getElementById("btnCreateTest");
        const statusMsg = document.getElementById("statusMessage");
        const btnStart = document.getElementById("btnStartTest");

        btnCreate.style.display = "none";
        statusMsg.style.display = "block";
        
        const state = appState[selectedTopic];
        let levelText = state.currentLevel === 1 ? "Başlangıç/Kolay" : state.currentLevel === 2 ? "Orta Seviye" : "İleri/Zor Seviye";

        statusMsg.innerHTML = `
            <div>Yapay Zeka API ile bağlantı kuruluyor...</div>
            <div class="search-log">POST -> ${AI_CONFIG.apiUrl} <br>Konu: ${selectedTopic} | Seviye: ${levelText}</div>
        `;

        const systemPrompt = `Sen bir akademik bilişim sınavı soru üretme motorusun. Görevin, sana verilen konu ve zorluk seviyesine uygun, tamamen benzersiz ve teknik doğruluğu yüksek 5 şıklı (A, B, C, D, E) tam olarak ${TEST_LIMIT} adet soru üretmektir.
        Cevabını SADECE ve SADECE aşağıda belirtilen geçerli JSON array formatında döndürmelisin. Şıklarda cevabın doğru olduğunu belirten hiçbir ipucu veya "(Doğru Cevap)" gibi ibareler ASLA yer almamalıdır. Düz metin olmalıdır. Markdown etiketleri (\`\`\`json vb.) kesinlikle içermemelidir.
        
        JSON Format Şeması:
        [
          {
            "q": "Gerçek ve net bir teknik soru cümlesi?",
            "a": "Doğru şık metni (Doğal bir cevap cümlesi)",
            "b": "Yanlış çeldirici 1",
            "c": "Yanlış çeldirici 2",
            "d": "Yanlış çeldirici 3",
            "e": "Yanlış çeldirici 4"
          }
        ]`;

        const userPrompt = `Konu Başlığı: "${selectedTopic}"
        Hedef Zorluk Seviyesi: "${levelText}"
        Kullanıcının Geçmişte Yanlış Yaptığı Bazı Soru Örnekleri/Temaları: ${JSON.stringify(state.wrongQueue.slice(-3))}
        
        Lütfen kurallara uyarak tam olarak ${TEST_LIMIT} adet kaliteli soru içeren JSON array dökümanını oluştur.`;

        try {
            if (AI_CONFIG.apiKey === "YOUR_API_KEY_HERE" || !AI_CONFIG.apiKey) {
                throw new Error("API_KEY_NOT_SET");
            }

            const response = await fetch(AI_CONFIG.apiUrl, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${AI_CONFIG.apiKey}`
                },
                body: JSON.stringify({
                    model: AI_CONFIG.model,
                    messages: [
                        { role: "system", content: systemPrompt },
                        { role: "user", content: userPrompt }
                    ],
                    temperature: 0.7
                })
            });

            if (!response.ok) throw new Error(`API_ERROR: ${response.status}`);

            const data = await response.json();
            let aiResponseText = data.choices[0].message.content.trim();
            
            if(aiResponseText.startsWith("```json")) aiResponseText = aiResponseText.replace("```json", "");
            if(aiResponseText.endsWith("```")) aiResponseText = aiResponseText.substring(0, aiResponseText.length - 3);
            aiResponseText = aiResponseText.trim();

            const parsedQuestions = JSON.parse(aiResponseText);
            processGeneratedQuestions(parsedQuestions);

            statusMsg.innerHTML = "🎯 Yapay zeka soruları başarıyla üretti! Test hazır.";
            btnStart.style.display = "inline-block";

        } catch (error) {
            console.warn("AI API Hatası veya API Anahtarı Eksik. Akıllı Fallback Motoru Çalıştırılıyor...", error);
            statusMsg.innerHTML = "⚠️ Canlı API bağlantısı simüle ediliyor (Gelişmiş Lokal Sınav Modu)...";
            
            setTimeout(() => {
                const fallbackData = generateFallbackQuestions(selectedTopic, state.currentLevel);
                processGeneratedQuestions(fallbackData);
                statusMsg.innerHTML = "🎯 Gelişmiş Test Motoru soruları başarıyla üretti! Test hazır.";
                btnStart.style.display = "inline-block";
            }, 1000);
        }
    }

    function processGeneratedQuestions(questionsArray) {
        currentQuestions = questionsArray.map(item => {
            let options = [
                { text: item.a, isCorrect: true, id: "correct_ans" },
                { text: item.b, isCorrect: false, id: "w1" },
                { text: item.c, isCorrect: false, id: "w2" },
                { text: item.d, isCorrect: false, id: "w3" },
                { text: item.e, isCorrect: false, id: "w4" }
            ];
            return {
                text: item.q,
                options: shuffleArray(options),
                original: item 
            };
        });
    }

    function startTest() {
        document.getElementById("setupArea").style.display = "none";
        document.getElementById("testArea").style.display = "block";
        currentQuestionIdx = 0;
        score = 0;
        document.getElementById("scoreTracker").innerText = `Doğru: 0`;
        showQuestion();
    }

    function showQuestion() {
        hasAnswered = false;
        document.getElementById("btnNext").style.display = "none";
        document.getElementById("feedbackMessage").innerText = "";
        
        let qData = currentQuestions[currentQuestionIdx];
        document.getElementById("questionTracker").innerText = `Soru: ${currentQuestionIdx + 1} / ${TEST_LIMIT}`;
        document.getElementById("questionText").innerText = qData.text;

        const optionsList = document.getElementById("optionsList");
        optionsList.innerHTML = "";

        const prefix = ["A", "B", "C", "D", "E"];
        qData.options.forEach((opt, idx) => {
            const li = document.createElement("li");
            li.className = "option-item";
            li.innerHTML = `<strong>${prefix[idx]})</strong> ${opt.text}`;
            li.onclick = () => checkAnswer(li, opt);
            optionsList.appendChild(li);
        });
    }

    function checkAnswer(selectedLi, selectedOpt) {
        if (hasAnswered) return;
        hasAnswered = true;

        const optionsList = document.getElementById("optionsList").children;
        const currentQ = currentQuestions[currentQuestionIdx];

        let rawQuestionObj = {
            q: currentQ.text,
            a: currentQ.original.a,
            b: currentQ.original.b,
            c: currentQ.original.c,
            d: currentQ.original.d,
            e: currentQ.original.e
        };

        if (selectedOpt.isCorrect) {
            selectedLi.classList.add("correct");
            document.getElementById("feedbackMessage").innerHTML = "<span style='color:var(--success-color);'>✓ Doğru</span>";
            score++;
            document.getElementById("scoreTracker").innerText = `Doğru: ${score}`;
            
            let state = appState[selectedTopic];
            let foundIdx = state.wrongQueue.findIndex(item => item.q === currentQ.text);
            if(foundIdx > -1) state.wrongQueue.splice(foundIdx, 1);

        } else {
            selectedLi.classList.add("wrong");
            document.getElementById("feedbackMessage").innerHTML = "<span style='color:var(--danger-color);'>✗ Yanlış</span>";
            
            wrongQuestionsInThisTest.push(rawQuestionObj);

            for (let li of optionsList) {
                let optText = li.innerText.substring(3).trim();
                let matchOpt = currentQ.options.find(o => o.text.trim() === optText);
                if (matchOpt && matchOpt.isCorrect) {
                    li.classList.add("correct");
                }
            }
        }
        document.getElementById("btnNext").style.display = "inline-block";
    }

    function nextQuestion() {
        currentQuestionIdx++;
        if (currentQuestionIdx < TEST_LIMIT) {
            showQuestion();
        } else {
            showResults();
        }
    }

    function showResults() {
        document.getElementById("testArea").style.display = "none";
        document.getElementById("resultArea").style.display = "block";
        
        let percentage = (score / TEST_LIMIT) * 100;
        document.getElementById("scoreBoard").innerText = `Başarı Oranı: %${percentage} (${score} / ${TEST_LIMIT} Doğru)`;

        const state = appState[selectedTopic];
        let levelFeedbackText = "";

        wrongQuestionsInThisTest.forEach(wQ => {
            if(!state.wrongQueue.some(q => q.q === wQ.q)) {
                state.wrongQueue.push(wQ);
            }
        });

        if (percentage >= 70) {
            if (state.currentLevel < 3) {
                state.currentLevel++;
                levelFeedbackText = `<span style='color:var(--success-color); font-weight:bold;'>Tebrikler! Başarı oranınız %70 üzerinde. Bir üst uzmanlık seviyesine yükseldiniz!</span>`;
            } else {
                levelFeedbackText = `<span style='color:var(--success-color); font-weight:bold;'>Harika! En yüksek seviye olan Seviye 3 (Zor) aşamasını başarıyla tamamladınız.</span>`;
            }
        } else if (percentage < 40) {
            if (state.currentLevel > 1) {
