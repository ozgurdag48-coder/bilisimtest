<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bilişim Teknolojileri Sınav Hazırlık Portalı</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #3498db;
            --success-color: #2ecc71;
            --danger-color: #e74c3c;
            --background-color: #ecf0f1;
            --text-color: #333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--background-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        h1, h2 {
            text-align: center;
            color: var(--primary-color);
        }

        .btn {
            background-color: var(--secondary-color);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 10px 5px;
            display: inline-block;
        }

        .btn:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        .btn-nav {
            background-color: #7f8c8d;
        }

        .btn-success {
            background-color: var(--success-color);
        }

        /* Ana Sayfa Konu Listesi */
        .topic-list {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 30px;
        }

        @media (max-width: 600px) {
            .topic-list { grid-template-columns: 1fr; }
        }

        .topic-card {
            background: #f8f9fa;
            border: 2px solid #dee2e6;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.3s;
            font-weight: 600;
        }

        .topic-card:hover {
            border-color: var(--secondary-color);
            background: #eef7fc;
        }

        /* Durum ve Test Alanları */
        .page { display: none; }
        .active { display: block; }

        .status-msg {
            font-weight: bold;
            color: #e67e22;
            margin: 20px 0;
            text-align: center;
            font-size: 18px;
        }

        /* Soru Yapısı */
        .question-container {
            margin-top: 25px;
            padding: 20px;
            border-left: 5px solid var(--secondary-color);
            background: #fdfdfd;
        }

        .options-list {
            list-style: none;
            padding: 0;
        }

        .option-item {
            margin: 10px 0;
            padding: 12px;
            border: 1px solid #ced4da;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .option-item:hover {
            background-color: #f1f3f5;
        }

        .option-item.correct {
            background-color: #d4edda !important;
            border-color: #c3e6cb;
            color: #155724;
        }

        .option-item.wrong {
            background-color: #f8d7da !important;
            border-color: #f5c6cb;
            color: #721c24;
        }

        .nav-buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
            border-top: 1px solid #eee;
            padding-top: 15px;
        }

        .score-board {
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            margin-top: 20px;
            color: var(--primary-color);
        }
    </style>
</head>
<body>

<div class="container">
    
    <!-- ANA SAYFA -->
    <div id="homePage" class="page active">
        <h1>KHK Bilişim Öğretmenliği Sınav Hazırlık</h1>
        <p style="text-align:center; color:#666;">Çalışmak istediğiniz konu başlığını seçiniz:</p>
        <div class="topic-list" id="topicList"></div>
    </div>

    <!-- KONU VE TEST ALANI -->
    <div id="quizPage" class="page">
        <button class="btn btn-nav" onclick="goHome()">← Ana Sayfa / Geri</button>
        <h2 id="currentTopicTitle">Konu Başlığı</h2>
        
        <!-- Test Oluşturma Aşaması -->
        <div id="setupArea" style="text-align: center; margin: 40px 0;">
            <button class="btn" id="btnCreateTest" onclick="generateTest()">Test Oluştur</button>
            <div id="statusMessage" class="status-msg" style="display: none;"></div>
            <button class="btn btn-success" id="btnStartTest" style="display: none;" onclick="startTest()">Teste Başla</button>
        </div>

        <!-- Canlı Test Alanı -->
        <div id="testArea" style="display: none;">
            <div style="font-weight: bold; color: #7f8c8d;" id="questionTracker">Soru: 1/5</div>
            <div class="question-container">
                <p id="questionText" style="font-size: 18px; font-weight: 600;"></p>
                <ul class="options-list" id="optionsList"></ul>
            </div>
            <div class="nav-buttons">
                <div id="feedbackMessage" style="font-weight: bold; align-self: center;"></div>
                <button class="btn" id="btnNext" onclick="nextQuestion()" style="display: none;">Sonraki Soru</button>
            </div>
        </div>

        <!-- Sonuç Alanı -->
        <div id="resultArea" style="display: none;">
            <h2>Test Tamamlandı!</h2>
            <div class="score-board" id="scoreBoard"></div>
            <div style="text-align: center; margin-top: 20px;">
                <button class="btn" onclick="retryTopic()">Yeniden Test Oluştur</button>
            </div>
        </div>
    </div>

</div>

<script>
    // Soru Havuzu Veri Tabanı (Farklı formatlarda dinamik şablonlar üretmek için kullanılacak temeller)
    const questionBank = {
        "Donanım ve Sayı Sistemleri": [
            { q: "Aşağıdakilerden hangisi bir iç donanım birimidir?", a: "Anakart", b: "Yazıcı", c: "Tarayıcı", d: "Klavye", e: "Ekran" },
            { q: "İkili (Binary) sistemdeki '1010' sayısının onlu (Decimal) sistemdeki karşılığı nedir?", a: "10", b: "8", c: "12", d: "6", e: "14" },
            { q: "Bilgisayarda verilerin geçici olarak tutulduğu donanım birimi hangisidir?", a: "RAM", b: "Sabit Disk", c: "ROM", d: "İşlemci", e: "Ekran Kartı" },
            { q: "Aşağıdakilerden hangisi hem girdi hem çıktı birimi olarak kullanılabilir?", a: "Dokunmatik Ekran", b: "Hoparlör", c: "Klavye", d: "Projeksiyon", e: "Mikrofon" },
            { q: "İşlemcinin (CPU) hız birimi aşağıdakilerden hangisidir?", a: "GHz", b: "GB", c: "RPM", d: "Mbps", e: "Watt" }
        ],
        "Algoritma ve Programlama": [
            { q: "Bir algoritmanın görsel olarak geometrik şekillerle ifade edilmesine ne denir?", a: "Akış Şeması", b: "Kodlama", c: "Pseudocode", d: "Derleme", e: "Hata Ayıklama" },
            { q: "Python dilinde ekrana çıktı vermek için hangi fonksiyon kullanılır?", a: "print()", b: "input()", c: "echo()", d: "output()", e: "write()" },
            { q: "Belirli bir koşul sağlandığı sürece tekrarlanan döngü yapısı hangisidir?", a: "while", b: "if", c: "switch", d: "break", e: "function" },
            { q: "Programlama dillerinde 'if-else' yapısı ne amaçla kullanılır?", a: "Koşullu Dallanma", b: "Döngü Oluşturma", c: "Değişken Tanımlama", d: "Veri Tipi Dönüştürme", e: "Fonksiyon Çağırma" },
            { q: "0-10 arası çift sayıları yazdırmak için kurulan döngüde artış miktarı kaç olmalıdır?", a: "2", b: "1", c: "3", d: "0", e: "5" }
        ],
        "Web Tasarımı ve Programlama": [
            { q: "Bir web sayfasının temel iskeletini ve içeriğini oluşturmak için hangi dil kullanılır?", a: "HTML", b: "CSS", c: "JavaScript", d: "PHP", e: "SQL" },
            { q: "Web sayfalarına stil, renk ve görsel düzen kazandırmak için hangisi kullanılır?", a: "CSS", b: "HTML", c: "XML", d: "Python", e: "Java" },
            { q: "Aşağıdaki HTML etiketlerinden hangisi bir köprü (link) oluşturmak için kullanılır?", a: "&lt;a&gt;", b: "&lt;link&gt;", c: "&lt;href&gt;", d: "&lt;img&gt;", e: "&lt;p&gt;" },
            { q: "İstemci tarafında (Client-side) dinamik ve etkileşimli web sayfaları geliştirmek için kullanılan dil hangisidir?", a: "JavaScript", b: "SQL", c: "CSS", d: "C#", e: "Apache" },
            { q: "HTML'de en büyük başlık stili aşağıdakilerden hangisidir?", a: "&lt;h1&gt;", b: "&lt;h6&gt;", c: "&lt;head&gt;", d: "&lt;heading&gt;", e: "&lt;title&gt;" }
        ],
        "Bilgisayar Ağları ve Güvenlik": [
            { q: "Aynı coğrafi alandaki (örneğin bir okul veya ofis) bilgisayarların bağlanmasıyla oluşan ağ türü hangisidir?", a: "LAN", b: "WAN", c: "MAN", d: "PAN", e: "VPN" },
            { q: "Ağ üzerindeki cihazların birbirini tanımasını sağlayan benzersiz mantıksal adrese ne denir?", a: "IP Adresi", b: "MAC Adresi", c: "DNS", d: "Gateway", e: "URL" },
            { q: "Verilerin ağ üzerinden güvenli bir şekilde aktarılmasını sağlayan şifreli web protokolü hangisidir?", a: "HTTPS", b: "HTTP", c: "FTP", d: "SMTP", e: "Telnet" },
            { q: "Ağa yetkisiz erişimleri engellemek amacıyla kullanılan güvenlik donanımı veya yazılımına ne ad verilir?", a: "Güvenlik Duvarı (Firewall)", b: "Router", c: "Switch", d: "Modem", e: "Access Point" },
            { q: "Web sitelerinin IP adreslerini akılda kalıcı alan adlarına (Domain) çeviren sistem hangisidir?", a: "DNS", b: "DHCP", c: "FTP", d: "OSI", e: "TCP" }
        ]
    };

    let selectedTopic = "";
    let currentQuestions = [];
    let currentQuestionIdx = 0;
    let score = 0;
    let hasAnswered = false;

    // Sayfa Yüklendiğinde Ana Ekranı Hazırla
    document.addEventListener("DOMContentLoaded", () => {
        const listContainer = document.getElementById("topicList");
        Object.keys(questionBank).forEach(topic => {
            const card = document.createElement("div");
            card.className = "topic-card";
            card.innerText = topic;
            card.onclick = () => loadTopic(topic);
            listContainer.appendChild(card);
        });
    });

    // Konu Sayfasına Geçiş
    function loadTopic(topic) {
        selectedTopic = topic;
        document.getElementById("homePage").classList.remove("active");
        document.getElementById("quizPage").classList.add("active");
        document.getElementById("currentTopicTitle").innerText = topic;
        resetQuizInterface();
    }

    function goHome() {
        document.getElementById("quizPage").classList.remove("active");
        document.getElementById("homePage").classList.add("active");
    }

    function resetQuizInterface() {
        document.getElementById("setupArea").style.display = "block";
        document.getElementById("btnCreateTest").style.display = "inline-block";
        document.getElementById("statusMessage").style.display = "none";
        document.getElementById("btnStartTest").style.display = "none";
        document.getElementById("testArea").style.display = "none";
        document.getElementById("resultArea").style.display = "none";
    }

    // TEST OLUŞTURMA ALGORİTMASI (Her basıldığında şıkları ve soruları karıştırarak farklı format sağlar)
    function generateTest() {
        const btnCreate = document.getElementById("btnCreateTest");
        const statusMsg = document.getElementById("statusMessage");
        const btnStart = document.getElementById("btnStartTest");

        btnCreate.style.display = "none";
        statusMsg.innerText = "Test oluşturuluyor...";
        statusMsg.style.display = "block";

        // Farklı format hissi yaratmak için yapay gecikme simülasyonu
        setTimeout(() => {
            statusMsg.innerText = "Test başarıyla farklı formatta oluşturuldu!";
            btnStart.style.display = "inline-block";
            
            // Havuzdaki soruları kopyala ve rastgele karıştır (Fisher-Yates Shuffle)
            let rawQuestions = [...questionBank[selectedTopic]];
            currentQuestions = shuffleArray(rawQuestions).map(qItem => {
                // Şıkları dinamik ve her seferinde farklı sırada eşle
                let options = [
                    { text: qItem.a, isCorrect: true },
                    { text: qItem.b, isCorrect: false },
                    { text: qItem.c, isCorrect: false },
                    { text: qItem.d, isCorrect: false },
                    { text: qItem.e, isCorrect: false }
                ];
                return {
                    question: qItem.q,
                    options: shuffleArray(options) // Şıkları da kendi içinde karıştırır
                };
            });

        }, 1200); 
    }

    // Testi Başlatma
    function startTest() {
        document.getElementById("setupArea").style.display = "none";
        document.getElementById("testArea").style.display = "block";
        currentQuestionIdx = 0;
        score = 0;
        showQuestion();
    }

    // Soruyu Ekrana Getirme
    function showQuestion() {
        hasAnswered = false;
        document.getElementById("btnNext").style.display = "none";
        document.getElementById("feedbackMessage").innerText = "";
        
        let qData = currentQuestions[currentQuestionIdx];
        document.getElementById("questionTracker").innerText = `Soru: ${currentQuestionIdx + 1} / ${currentQuestions.length}`;
        document.getElementById("questionText").innerHTML = qData.question;

        const optionsList = document.getElementById("optionsList");
        optionsList.innerHTML = "";

        // 5 Şıkkı (A, B, C, D, E) eşleştirerek basma
        const prefix = ["A", "B", "C", "D", "E"];
        qData.options.forEach((opt, idx) => {
            const li = document.createElement("li");
            li.className = "option-item";
            li.innerHTML = `<strong>${prefix[idx]})</strong> ${opt.text}`;
            li.onclick = () => checkAnswer(li, opt.isCorrect);
            optionsList.appendChild(li);
        });
    }

    // Cevap Kontrolü
    function checkAnswer(selectedLi, isCorrect) {
        if (hasAnswered) return; // Bir kez tıklandıysa işlem yapma
        hasAnswered = true;

        const optionsList = document.getElementById("optionsList").children;

        if (isCorrect) {
            selectedLi.classList.add("correct");
            document.getElementById("feedbackMessage").innerHTML = "<span style='color:var(--success-color);'>Doğru Tebrikler!</span>";
            score++;
        } else {
            selectedLi.classList.add("wrong");
            document.getElementById("feedbackMessage").innerHTML = "<span style='color:var(--danger-color);'>Yanlış Cevap.</span>";
            
            // Doğru şıkkı yeşil olarak vurgula
            for (let li of optionsList) {
                let optText = li.innerText.substring(3).trim(); // Başındaki şık harfini kırp
                let matchOpt = currentQuestions[currentQuestionIdx].options.find(o => o.text.trim() === optText);
                if (matchOpt && matchOpt.isCorrect) {
                    li.classList.add("correct");
                }
            }
        }

        document.getElementById("btnNext").style.display = "inline-block";
    }

    // Sonraki Soruya Geçiş veya Bitirme
    function nextQuestion() {
        currentQuestionIdx++;
        if (currentQuestionIdx < currentQuestions.length) {
            showQuestion();
        } else {
            showResults();
        }
    }

    // Sonuç Ekranı
    function showResults() {
        document.getElementById("testArea").style.display = "none";
        document.getElementById("resultArea").style.display = "block";
        document.getElementById("scoreBoard").innerText = `Toplam Soru: ${currentQuestions.length} | Doğru Cevap: ${score} | Başarı Oranı: %${(score/currentQuestions.length)*100}`;
    }

    function retryTopic() {
        resetQuizInterface();
    }

    // Dizi Karıştırma Yardımcı Fonksiyonu
    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }
</script>

</body>
</html>
